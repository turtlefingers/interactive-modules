<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오픈소스 일러스트 미리보기 · 인터랙티브 모듈들</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  body { margin: 0; background: #f4f2ee; font-family: "Pretendard Variable", sans-serif; color: #1b1b1a; padding: 28px; }
  h2 { font-size: 16px; margin: 26px 0 4px; }
  p { font-size: 13px; color: #5d5b57; margin: 0 0 12px; }
  .row { display: flex; gap: 18px; align-items: flex-end; background: #fff; border-radius: 12px; padding: 20px; }
  .row img { height: 260px; }
  .row img.peep { height: 300px; }
  .row img.peep { height: 300px; width: auto; }
</style>
</head>
<body>
<h2>A. Humaaans (Pablo Stanley, CC BY 4.0) — 외곽선 없는 실루엣. 색은 우리 팔레트로 바꿨다</h2>
<p>머리 18종 × 상의 10종 × 하의(서기 7종 · 앉기 4종)를 조합한다. 부품이 나뉘어 있어 팔·다리 애니메이션이 가능하다.</p>
<div class="row"><img src="/illo-preview/h1.svg"><img src="/illo-preview/h2.svg"><img src="/illo-preview/h3.svg"><img src="/illo-preview/h4.svg"><img src="/illo-preview/h5.svg"></div>
<h2>B. Open Peeps (Pablo Stanley, CC0) — 손으로 그린 선 드로잉 + 한 색 채움</h2>
<p>포즈 28종(서기) + 상반신 30종, 표정 36종, 머리 60종을 조합한다. 선 색과 채움 색을 자유롭게 정할 수 있다.</p>
<div class="row"><img class="peep" src="/illo-preview/p1.svg"><img class="peep" src="/illo-preview/p2.svg"><img class="peep" src="/illo-preview/p3.svg"><img class="peep" src="/illo-preview/p4.svg"><img class="peep" src="/illo-preview/p5.svg"></div>
</body>
</html>
