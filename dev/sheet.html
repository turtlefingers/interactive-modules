<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>사물 시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>body{margin:0;background:#f4f2ee}canvas{display:block}</style></head>
<body>
<script type="module">
  // 검사용 시트: /sheet.html?name=cookie&cols=3 — 한 사물의 모든 타입을 한 장의 캔버스로 그린다 (채팅에 올릴 이미지용).
  import "../src/lib/objects/index.js";
  import { OBJECTS } from "../src/lib/objects.js";
  import { TONE, ILLO } from "../src/lib/draw.js";
  const q = new URLSearchParams(location.search);
  const name = q.get("name"), cols = +(q.get("cols") || 3), states = (q.get("states") || "0.15,0.85").split(",").map(Number), zoom = +(q.get("zoom") || 1);
  const def = OBJECTS[name]; const keys = Object.keys(def.variants);
  const W = 230, H = 150, pad = 12, lab = 22, dpr = 2, rows = Math.ceil(keys.length / cols);
  const cv = document.createElement("canvas"); const CW = cols * (W + pad) + pad, CH = rows * (H + lab + pad) + pad;
  cv.width = CW * dpr; cv.height = CH * dpr; cv.style.width = CW + "px"; document.body.appendChild(cv);
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  await document.fonts.ready;
  g.fillStyle = "#f4f2ee"; g.fillRect(0, 0, CW, CH);
  keys.forEach((k, i) => {
    const cx = pad + (i % cols) * (W + pad), cy = pad + Math.floor(i / cols) * (H + lab + pad);
    g.save(); g.translate(cx, cy);
    g.fillStyle = "#e9e4d8"; g.fillRect(0, 0, W, H); g.fillStyle = TONE[2]; g.fillRect(0, 118, W, 32); g.fillStyle = TONE[3]; g.fillRect(0, 118, W, 1.5);
    states.forEach((s, j) => { g.save(); g.translate(states.length > 1 ? W * (0.3 + 0.4 * j) : W / 2, 118);
      try { def.variants[k].draw(g, 0, 0, (def.height || 84) * zoom, { t: 1.3 + j, state: s, color: def.color || ILLO.green, accent: ILLO.orange }); } catch (e) { g.fillStyle = "#c00"; g.fillText(e.message, -100, -40); }
      g.restore(); });
    g.fillStyle = "#1b1b1a"; g.font = "600 13px 'Pretendard Variable', sans-serif"; let txt = k + "  " + (def.variants[k].label || ""); while (g.measureText(txt).width > W - 4 && txt.length > 3) txt = txt.slice(0, -2) + "…"; g.fillText(txt, 2, H + 16);
    g.restore();
  });
  window.__png = cv.toDataURL("image/png");
  document.title = "sheet:" + name + " ready";
</script>
</body></html>
