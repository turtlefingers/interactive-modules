<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>그림체 시안 5종 · 인터랙티브 모듈들</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  body { margin: 0; background: #f4f2ee; font-family: "Pretendard Variable", sans-serif; color: #1b1b1a; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.lead { margin: 0 0 22px; color: #5d5b57; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .col { background: #fff; border-radius: 12px; padding: 14px 14px 12px; }
  .col h2 { font-size: 15px; margin: 0 0 2px; }
  .col h2 b { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: #1b1b1a; color: #fff; font-size: 12px; text-align: center; line-height: 22px; margin-right: 6px; }
  .col p { font-size: 12px; color: #5d5b57; margin: 0 0 10px; line-height: 1.5; min-height: 54px; }
  canvas { display: block; width: 100%; background: #f4f2ee; border-radius: 8px; }
</style>
</head>
<body>
<h1>그림체 시안 5종</h1>
<p class="lead">같은 소재(사람 · 새 · 풍경 · 풍선 · 얼굴)를 다섯 방식으로 그렸다. 위에서부터 사람, 새와 얼굴, 풍경, 풍선이다.</p>
<div class="grid" id="grid"></div>
<script type="module">
  import { ILLO, TONE } from "./src/lib/draw.js";
  const STYLES = [
    { key: "tone", name: "톤 면", desc: "베이지·회색 톤의 면만으로 그린다. 외곽선 없음. 강조색 하나만 쓴다. 기존 패럴랙스의 방향이다.",
      ink: "#1b1b1a", body: TONE[3], skin: TONE[2], acc: "#ff5a36", leg: TONE[5], scene: [TONE[1], TONE[2], TONE[3], TONE[4]], outline: 0, detail: 1.4, balloon: "#ff5a36", bird: TONE[4] },
    { key: "silhouette", name: "실루엣 + 잉크 디테일", desc: "외곽선 없는 색 실루엣에 얼굴·손가락만 가는 검정 선. 색은 두 가지와 살색까지. 레퍼런스 1·3에 가깝다.",
      ink: "#1b1b1a", body: ILLO.blue, skin: ILLO.skin, acc: ILLO.orange, leg: "#1b1b1a", scene: [TONE[1], ILLO.blue, TONE[3], "#1b1b1a"], outline: 0, detail: 1.5, balloon: ILLO.orange, bird: ILLO.orange },
    { key: "lineone", name: "선 + 한 색", desc: "가는 검정 선 드로잉에 파랑 한 색만 채운다. 채움이 선에서 살짝 어긋난다. 레퍼런스 2에 가깝다.",
      ink: "#1b1b1a", body: ILLO.blue, skin: null, acc: ILLO.blue, leg: null, scene: [null, ILLO.blue, null, null], outline: 1.5, detail: 1.5, balloon: ILLO.blue, bird: null, offset: 2.5 },
    { key: "thinline", name: "가는 윤곽 + 차분한 색", desc: "모든 덩어리에 1.5px 가는 윤곽. 채움은 채도를 낮춘 색. 레퍼런스 4·5의 사물 스티커 느낌이다.",
      ink: "#1b1b1a", body: "#7fa3e8", skin: "#f3d9c6", acc: "#f0a07a", leg: "#c9c1af", scene: ["#e8e2d5", "#cfd8e8", "#bfd3bf", "#d9c6b8"], outline: 1.5, detail: 1.5, balloon: "#f0a07a", bird: "#d9b66a" },
    { key: "mono", name: "잉크 실루엣", desc: "검정 실루엣과 크림, 강조색 하나. 픽토그램처럼 단단하고 그래픽적이다. 얼굴은 크림색 선으로 뺀다.",
      ink: "#1b1b1a", body: "#1b1b1a", skin: "#1b1b1a", acc: "#ff5a36", leg: "#1b1b1a", scene: [TONE[2], TONE[4], "#1b1b1a", "#1b1b1a"], outline: 0, detail: 1.6, balloon: "#ff5a36", bird: "#1b1b1a", faceInk: "#f4f2ee" }
  ];
  const TAU = Math.PI * 2;
  const grid = document.getElementById("grid");

  function fillStroke(g, S, fill, path) {
    g.save(); g.lineJoin = "round"; g.lineCap = "round";
    if (fill) { g.save(); if (S.offset) g.translate(S.offset, S.offset); g.beginPath(); path(g); g.fillStyle = fill; g.fill(); g.restore(); }
    if (S.outline) { g.beginPath(); path(g); g.strokeStyle = S.ink; g.lineWidth = S.outline; g.stroke(); }
    g.restore();
  }
  const ln = (g, S, pts, w, col) => { g.save(); g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = col || S.ink; g.lineWidth = w; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.stroke(); g.restore(); };
  const tube = (g, S, pts, w, col) => { if (col) ln(g, S, pts, w, col); if (S.outline) { g.save(); g.lineCap = "round"; g.strokeStyle = S.ink; g.lineWidth = w + S.outline * 2; g.globalCompositeOperation = "destination-over"; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.stroke(); g.restore(); } };
  const dot = (g, x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); };

  function faceOn(g, S, x, y, r, mood = "happy", look = { x: 0.5, y: 0 }) {
    const ink = S.faceInk || S.ink, d = S.detail;
    const ex = r * 0.36, ey = -r * 0.1, er = Math.max(1.4, r * 0.07), lx = look.x * r * 0.14;
    dot(g, x - ex + lx, y + ey, er, ink); dot(g, x + ex + lx, y + ey, er, ink);
    const my = y + r * 0.34, mw = r * 0.22;
    g.save(); g.strokeStyle = ink; g.lineWidth = d; g.lineCap = "round"; g.beginPath();
    if (mood === "happy") { g.moveTo(x - mw + lx * .5, my - mw * .25); g.quadraticCurveTo(x + lx * .5, my + mw * .55, x + mw + lx * .5, my - mw * .25); }
    else { g.moveTo(x - mw * .8, my); g.lineTo(x + mw * .8, my); }
    g.stroke(); g.restore();
  }
  function person(g, S, x, y, h, pose) {
    const s = h / 140, hr = 17 * s, bw = 46 * s, bh = 62 * s, legLen = 44 * s;
    const bodyBottom = y - legLen, bodyTop = bodyBottom - bh, headY = bodyTop - hr + 6 * s;
    const legC = S.leg || null, bodyC = S.body, skinC = S.skin;
    // 다리
    tube(g, S, [[x - bw * .2, bodyBottom - 6 * s], [x - bw * .2, y]], 13 * s, legC || S.body);
    tube(g, S, [[x + bw * .2, bodyBottom - 6 * s], [x + bw * .2, y]], 13 * s, legC || S.body);
    if (S.key === "lineone") { fillStroke(g, S, null, c => { c.moveTo(x - bw * .2 - 6.5 * s, bodyBottom - 6 * s); c.lineTo(x - bw * .2 - 6.5 * s, y); c.lineTo(x - bw * .2 + 6.5 * s, y); c.lineTo(x - bw * .2 + 6.5 * s, bodyBottom - 6 * s); }); fillStroke(g, S, null, c => { c.moveTo(x + bw * .2 - 6.5 * s, bodyBottom - 6 * s); c.lineTo(x + bw * .2 - 6.5 * s, y); c.lineTo(x + bw * .2 + 6.5 * s, y); c.lineTo(x + bw * .2 + 6.5 * s, bodyBottom - 6 * s); }); }
    fillStroke(g, S, S.ink, c => c.ellipse(x - bw * .2 + s, y, 9 * s, 3.5 * s, 0, 0, TAU));
    fillStroke(g, S, S.ink, c => c.ellipse(x + bw * .2 + s, y, 9 * s, 3.5 * s, 0, 0, TAU));
    // 몸통
    fillStroke(g, S, bodyC, c => c.roundRect(x - bw / 2, bodyTop, bw, bh, [20 * s, 20 * s, 10 * s, 10 * s]));
    // 팔
    const shY = bodyTop + 12 * s, wave = pose === "wave";
    const aL = [[x - bw / 2 + 5 * s, shY], [x - bw / 2 - 8 * s, bodyBottom - 4 * s]];
    const aR = [[x + bw / 2 - 5 * s, shY], [x + bw / 2 + 8 * s, wave ? bodyTop - 18 * s : bodyBottom - 4 * s]];
    tube(g, S, aL, 12 * s, bodyC); tube(g, S, aR, 12 * s, bodyC);
    for (const a of [aL, aR]) {
      const [hx, hy] = a[1];
      fillStroke(g, S, skinC || "#f4f2ee", c => c.arc(hx, hy, 6 * s, 0, TAU));
      for (let i = -1; i <= 1; i++) ln(g, S, [[hx + i * 2.4 * s, hy + 1 * s], [hx + i * 2.8 * s, hy + 5.5 * s]], S.detail * .8, S.faceInk && skinC === S.ink ? S.faceInk : S.ink);
    }
    // 목·머리
    tube(g, S, [[x, bodyTop + 2 * s], [x, headY + hr * .6]], 8 * s, skinC || "#f4f2ee");
    fillStroke(g, S, skinC || "#f4f2ee", c => c.arc(x, headY, hr, 0, TAU));
    fillStroke(g, S, S.ink, c => { c.arc(x, headY, hr + 1.5 * s, Math.PI * 1.02, Math.PI * 1.98); c.closePath(); });
    faceOn(g, S, x, headY + 2 * s, hr, "happy");
  }
  function bird(g, S, x, y, size, angle, flap) {
    const s = size / 26, col = S.bird;
    g.save(); g.translate(x, y); g.rotate(angle);
    fillStroke(g, S, col, c => { c.moveTo(-10 * s, -1 * s); c.lineTo(-22 * s, -7 * s); c.lineTo(-19 * s, 5 * s); c.closePath(); });
    fillStroke(g, S, col, c => c.ellipse(0, 0, 14 * s, 8.5 * s, 0, 0, TAU));
    fillStroke(g, S, col, c => c.arc(12 * s, -5 * s, 6 * s, 0, TAU));
    const tip = -flap * 13 * s;
    fillStroke(g, S, col, c => { c.moveTo(-4 * s, -2 * s); c.quadraticCurveTo(-3 * s, tip - 6 * s, -17 * s, tip - 2 * s); c.lineTo(5 * s, -2 * s); c.closePath(); });
    if (!S.outline) ln(g, S, [[-4 * s, -2 * s], [-15 * s, tip - 2 * s]], S.detail * .8, S.faceInk && col === S.ink ? S.faceInk : S.ink);
    fillStroke(g, S, S.faceInk && col === S.ink ? S.acc : S.ink, c => { c.moveTo(17.5 * s, -6 * s); c.lineTo(24 * s, -4.5 * s); c.lineTo(17.5 * s, -3 * s); c.closePath(); });
    dot(g, 13.5 * s, -6.5 * s, 1.4 * s, S.faceInk && col === S.ink ? S.faceInk : S.ink);
    g.restore();
  }
  function scene(g, S, x, y, w, h) {
    const [far, mid, hill, tree] = S.scene;
    // 먼 산
    fillStroke(g, S, far, c => { c.moveTo(x, y + h); c.lineTo(x, y + h * .55); c.lineTo(x + w * .18, y + h * .2); c.lineTo(x + w * .36, y + h * .5); c.lineTo(x + w * .55, y + h * .1); c.lineTo(x + w * .78, y + h * .48); c.lineTo(x + w, y + h * .3); c.lineTo(x + w, y + h); c.closePath(); });
    // 가까운 산
    fillStroke(g, S, mid, c => { c.moveTo(x, y + h); c.lineTo(x, y + h * .7); c.lineTo(x + w * .25, y + h * .42); c.lineTo(x + w * .5, y + h * .68); c.lineTo(x + w * .7, y + h * .38); c.lineTo(x + w, y + h * .66); c.lineTo(x + w, y + h); c.closePath(); });
    // 언덕
    fillStroke(g, S, hill, c => { c.moveTo(x, y + h); c.lineTo(x, y + h * .84); c.quadraticCurveTo(x + w * .5, y + h * .7, x + w, y + h * .86); c.lineTo(x + w, y + h); c.closePath(); });
    // 나무 (길쭉한 실루엣)
    for (const t of [0.22, 0.31, 0.62, 0.7, 0.86]) {
      const tx = x + w * t, ty = y + h * .8 + Math.sin(t * 9) * 3, th = h * .3, tw = th * .28;
      fillStroke(g, S, tree, c => { c.moveTo(tx - tw, ty); c.quadraticCurveTo(tx - tw * .9, ty - th * .55, tx, ty - th); c.quadraticCurveTo(tx + tw * .9, ty - th * .55, tx + tw, ty); c.closePath(); });
    }
    // 해
    fillStroke(g, S, S.acc, c => c.arc(x + w * .8, y + h * .18, h * .09, 0, TAU));
  }
  function balloon(g, S, x, y, r) {
    const cy = y - r * 1.9, rx = r, ry = r * 1.12;
    fillStroke(g, S, S.balloon, c => {
      c.moveTo(x, y - r * .5);
      c.bezierCurveTo(x - rx * .55, y - r * .55, x - rx * 1.02, cy + ry * .55, x - rx, cy);
      c.bezierCurveTo(x - rx, cy - ry * .75, x - rx * .55, cy - ry, x, cy - ry);
      c.bezierCurveTo(x + rx * .55, cy - ry, x + rx, cy - ry * .75, x + rx, cy);
      c.bezierCurveTo(x + rx * 1.02, cy + ry * .55, x + rx * .55, y - r * .55, x, y - r * .5);
      c.closePath();
    });
    fillStroke(g, S, S.balloon, c => { c.moveTo(x, y - r * .55); c.lineTo(x - 5, y - r * .3); c.lineTo(x + 5, y - r * .3); c.closePath(); });
    g.save(); g.strokeStyle = S.ink; g.lineWidth = S.detail; g.lineCap = "round";
    g.beginPath(); g.moveTo(x, y - r * .3); g.quadraticCurveTo(x + 10, y + r * .5, x, y + r * 1.3); g.stroke(); g.restore();
  }

  for (const [i, S] of STYLES.entries()) {
    const col = document.createElement("div"); col.className = "col";
    col.innerHTML = `<h2><b>${i + 1}</b>${S.name}</h2><p>${S.desc}</p><canvas></canvas>`;
    grid.appendChild(col);
    const cv = col.querySelector("canvas"), W = 240, H = 620, dpr = devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = "auto";
    const g = cv.getContext("2d"); g.scale(dpr, dpr);
    person(g, S, 70, 170, 150, "stand"); person(g, S, 170, 170, 150, "wave");
    bird(g, S, 60, 240, 30, -0.2, 0.4);
    fillStroke(g, S, S.skin || null, c => c.arc(150, 240, 26, 0, TAU)); faceOn(g, S, 150, 240, 26, "happy", { x: 0.8, y: 0 });
    fillStroke(g, S, S.ink, c => { c.arc(150, 240, 27.5, Math.PI * 1.02, Math.PI * 1.98); c.closePath(); });
    scene(g, S, 14, 290, W - 28, 190);
    balloon(g, S, 120, 560, 34);
  }
</script>
</body>
</html>
