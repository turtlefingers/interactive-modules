<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>동물 · 사물 선 그림 후보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  body { margin: 0; background: #f4f2ee; font-family: "Pretendard Variable", sans-serif; padding: 24px; color: #1b1b1a; }
  h3 { font-size: 15px; margin: 18px 0 8px; }
  .g { display: grid; gap: 12px; }
  .g.a { grid-template-columns: repeat(5, 1fr); }
  .g.b { grid-template-columns: repeat(9, 1fr); }
  .c { background: #fff; border-radius: 10px; padding: 12px; text-align: center; font-size: 12px; color: #5d5b57; }
  .c img { width: 100%; height: 150px; object-fit: contain; display: block; margin-bottom: 6px; }
  .g.b .c img { height: 90px; }
  .om img { filter: none; }
</style></head>
<body>
<h3>A. Open Doodles (Pablo Stanley, CC0) — Open Peeps와 같은 작가 · 검정 선 + 한 색 채움 (원본 색 그대로)</h3>
<div class="g a" id="od"></div>
<h3>B. OpenMoji black (CC BY-SA 4.0) — 손그림 선 아이콘, 동물·사물을 넓게 커버</h3>
<div class="g b om" id="om"></div>
<script>
  const od = ["Doggie","dog-jump","plant","coffee","ice-cream","reading","unboxing","selfie","petting","sitting"];
  document.getElementById("od").innerHTML = od.map(n => `<div class="c"><img src="/illo-preview/od-${n}.svg">${n}</div>`).join("");
  const om = [["1F408","고양이"],["1F426","새"],["1F54A","비둘기"],["1F41F","물고기"],["1F41D","벌"],["1F41E","무당벌레"],["1F407","토끼"],["1F415","개"],["1F989","올빼미"],["1F388","풍선"],["2601","구름"],["2615","컵"],["1F331","새싹"],["1F333","나무"],["26F0","산"],["1F3E0","집"],["1F4A1","전구"],["1F4A7","물방울"]];
  document.getElementById("om").innerHTML = om.map(([c,n]) => `<div class="c"><img src="/illo-preview/om-${c}.svg">${n}</div>`).join("");
</script></body></html>
