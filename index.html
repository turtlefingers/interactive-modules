<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인터랙티브 모듈들</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body class="index">

<header class="topbar">
  <a class="logo" href="./">인터랙티브 모듈들</a>
  <div class="spacer"></div>
  <input class="search" id="search" type="search" placeholder="이름, 다른 이름, 태그로 찾기" autocomplete="off">
</header>

<div class="wrap">
  <div class="hero">
    <h1><span>인터랙티브</span> 모듈들</h1>
    <p>마우스와 키보드로 만드는 웹 인터랙션을 입력 방식별로 정리했다. 항목을 열면 직접 만져볼 수 있고, 정의와 쓰임, AI에게 줄 프롬프트까지 함께 볼 수 있다.</p>
    <div class="count" id="count"></div>
  </div>

  <div class="filters">
    <div class="row"><span class="lbl">입력</span><span id="catLinks"></span>
      <span class="spacer" style="flex:1"></span>
      <span class="active-filter" id="activeFilter">#<b id="activeTag"></b><button id="clearTag">해제</button></span>
      <button class="tag-toggle" id="tagToggle">태그로 거르기</button>
    </div>
    <div class="row tagbar" id="tagbar"></div>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty">조건에 맞는 항목이 없다.</div>
  <footer class="credits">
    한예종 컨버전스 디자인2 · 인터랙티브 웹 수업 자료<br>
    사람 그림: <a href="https://www.humaaans.com" target="_blank" rel="noopener">Humaaans</a> by Pablo Stanley (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>), 색과 조합을 바꿔 썼다 · 동물 실루엣: <a href="https://www.phylopic.org" target="_blank" rel="noopener">PhyloPic</a> (CC0) · 아이콘: <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a> (ISC)
  </footer>
</div>

<script type="module" src="/src/pages/index.js"></script>
</body>
</html>
